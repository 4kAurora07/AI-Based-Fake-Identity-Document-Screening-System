services:
  - type: web
    name: docshield-backend
    env: docker
    dockerfilePath: ./docshield-backend/Dockerfile
    dockerContext: ./docshield-backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DOCSHIELD_AES_KEY
        value: 897aa89efdea98fe834ce38cc4abc35e1a767af6a363244bf2a6cc54827167d2
      - key: CORS_ALLOWED_ORIGINS
        value: https://docshield-innovx.netlify.app,http://localhost:5173
      - key: RETAIN_UPLOADS_FOR_DEMO
        value: "false"
