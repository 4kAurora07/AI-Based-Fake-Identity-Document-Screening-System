[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# 1. API Reverse Proxy (Uncomment and replace with your deployed backend URL, e.g., Render/Railway)
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-BACKEND-URL.onrender.com/api/:splat"
#   status = 200
#   force = true

# 2. Single Page Application (SPA) Client-side Routing Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
