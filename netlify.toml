[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# 1. API Reverse Proxy (Bypasses CORS by proxying all /api/* requests to Render backend)
[[redirects]]
  from = "/api/*"
  to = "https://docshield-backend-pqi5.onrender.com/api/:splat"
  status = 200
  force = true

# 2. Single Page Application (SPA) Client-side Routing Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
